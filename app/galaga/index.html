<!doctype html>
<html lang="en" data-source-commit="f127e92130d3f3f50c9fc8ea5f169aebe8d4e0ce">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Galaga — Library Browser Port</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:"Courier New",monospace;overflow:hidden}body{display:grid;place-items:center}.frame{position:relative;width:min(100vw,900px);height:min(100vh,760px);display:grid;place-items:center;background:#02030c}canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-content:center;padding:2rem;text-align:center;background:rgba(0,0,0,.82);z-index:4}.overlay[hidden]{display:none}.overlay h1{margin:0;color:#f43f5e;font-size:clamp(2.8rem,10vw,5.5rem);letter-spacing:.08em;text-shadow:4px 4px #166534}.overlay p{max-width:34rem;color:#b7f7ff;line-height:1.55}.overlay button,.touch button{border:2px solid #4ff;border-radius:4px;background:#001f29;color:#fff;padding:.8rem 1.35rem;font:700 1rem monospace;box-shadow:0 0 14px #00ffff55}.overlay button:focus-visible,.touch button:focus-visible{outline:3px solid #fff;outline-offset:3px}.touch{position:absolute;inset:auto 0 max(.6rem,env(safe-area-inset-bottom));height:54px;z-index:3;pointer-events:none}.touch button{position:absolute;bottom:0;min-width:72px;min-height:52px;opacity:.8;pointer-events:auto;touch-action:none;user-select:none}.touch button[data-key="left"]{left:1rem}.touch button[data-key="right"]{left:6.2rem}.touch button[data-key="fire"]{right:1rem;color:#ffec69;border-color:#ff4058;background:#33010d}@media(pointer:fine){.touch{display:none}}@media(max-aspect-ratio:9/12){.frame{height:auto;aspect-ratio:900/760;align-self:center}}@media(prefers-reduced-motion:reduce){.overlay button,.touch button{box-shadow:none}}
  </style>
</head>
<body>
  <main class="frame" aria-label="Galaga game">
    <canvas id="gameCanvas" width="900" height="760" aria-label="Playable Galaga canvas. Move with Left and Right or A and D. Fire with Space."></canvas>
    <section class="overlay" id="overlay" aria-live="polite">
      <h1>GALAGA</h1>
      <p id="subtitle">Library Browser Port · Move with ← → or A / D · Fire with Space · Touch controls supported</p>
      <button id="startButton" type="button">START GAME</button>
    </section>
    <nav class="touch" aria-label="Touch game controls">
      <button data-key="left" type="button" aria-label="Move left">◀</button>
      <button data-key="fire" type="button" aria-label="Fire">FIRE</button>
      <button data-key="right" type="button" aria-label="Move right">▶</button>
    </nav>
  </main>
  <script src="game.js"></script>
</body>
</html>
