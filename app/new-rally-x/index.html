<!doctype html>
<html lang="th" data-source-commit="5e2fa82f31b9534830f8c9cc611f9e575515555c">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>New Rally-X — Library Edition</title>
  <style>
    :root{color-scheme:dark;--yellow:#ffe548;--blue:#1976ff;--ink:#050817}*{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(circle at 50% 20%,#14255c,#03050d 70%);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#fff;touch-action:none}
    body{display:grid;place-items:center;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
    main{position:relative;width:min(100%,calc((100vh - 16px)*1.5));aspect-ratio:3/2;max-height:calc(100vh - 16px);filter:drop-shadow(0 12px 34px #000)}
    canvas{display:block;width:100%;height:100%;background:#06143b;border:3px solid #e8f0ff;border-radius:10px;image-rendering:pixelated}
    .controls{position:absolute;inset:0;pointer-events:none}.pad,.smoke{position:absolute;bottom:4%;pointer-events:auto;user-select:none;-webkit-user-select:none}
    .pad{left:3%;width:142px;height:142px}.pad button,.smoke{border:2px solid #bfe0ff;background:#071c48cc;color:#fff;box-shadow:inset 0 0 12px #278aff66;border-radius:14px;font:700 24px inherit;touch-action:none}
    .pad button{position:absolute;width:46px;height:46px}.up{left:48px;top:0}.left{left:0;top:48px}.right{right:0;top:48px}.down{left:48px;bottom:0}
    .smoke{right:4%;width:88px;height:88px;border-radius:50%;color:var(--yellow);font-size:14px;letter-spacing:.06em}
    button:active{transform:scale(.94);background:#17448e}
    .help{position:absolute;left:50%;bottom:1.5%;transform:translateX(-50%);font-size:clamp(8px,1.5vw,13px);color:#c8dcff;text-shadow:0 1px #000;white-space:nowrap;pointer-events:none}
    @media (pointer:fine) and (min-width:800px){.pad,.smoke{opacity:.28}.pad:hover,.smoke:hover{opacity:1}}
  </style>
</head>
<body>
<main aria-label="เกม New Rally-X">
  <canvas id="gameCanvas" width="960" height="640" aria-label="สนามแข่งเขาวงกต New Rally-X"></canvas>
  <div class="controls" aria-label="ปุ่มควบคุมแบบสัมผัส">
    <div class="pad">
      <button class="up" data-key="ArrowUp" aria-label="ขึ้น">▲</button><button class="left" data-key="ArrowLeft" aria-label="ซ้าย">◀</button>
      <button class="right" data-key="ArrowRight" aria-label="ขวา">▶</button><button class="down" data-key="ArrowDown" aria-label="ลง">▼</button>
    </div>
    <button class="smoke" data-key="Space" aria-label="ปล่อยม่านควัน">SMOKE<br>●</button>
  </div>
  <div class="help">ลูกศร / WASD ขับรถ · SPACE ปล่อยควัน · ENTER เริ่มใหม่</div>
</main>
<script src="game.js"></script>
</body>
</html>
