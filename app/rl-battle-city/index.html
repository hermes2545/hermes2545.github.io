<!doctype html>
<html lang="th" data-source-commit="6bd87671b066a9d187a3f488cc25b87f013f8e2d">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><text y=%2226%22 font-size=%2227%22>⭐</text></svg>">
  <title>RL Battle City — AI Autopilot</title>
  <style>
    :root{color-scheme:dark;--gold:#f4c542;--red:#e74c3c;--panel:#17191d}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#292d34,#090a0c 68%);color:#f5f5f5;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;display:flex;justify-content:center;overscroll-behavior:none}
    main{width:min(100%,760px);padding:clamp(10px,3vw,22px);text-align:center}h1{margin:.2rem 0;font-size:clamp(1.35rem,5vw,2.25rem);letter-spacing:.06em;color:var(--gold);text-shadow:2px 2px #713b00}p{margin:.25rem 0 .75rem;color:#bfc3ca;font-size:.9rem}
    .hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px auto;max-width:560px}.stat{background:var(--panel);border:1px solid #343942;padding:7px 4px;border-radius:7px;font-size:.78rem}.stat b{display:block;color:var(--gold);font-size:1rem}
    .stage{position:relative;width:min(92vw,560px);aspect-ratio:1;margin:auto;border:clamp(5px,1.3vw,9px) ridge #777;background:#050505;box-shadow:0 12px 35px #000}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
    .overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#000b;padding:20px}.overlay[hidden]{display:none}.overlay h2{color:var(--gold);font-size:clamp(1.8rem,8vw,3.2rem);margin:0 0 10px}.overlay p{color:white;max-width:390px}
    button{border:0;border-radius:7px;padding:10px 16px;background:#454b55;color:#fff;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #111}button:active{transform:translateY(2px);box-shadow:0 1px 0 #111}.primary{background:var(--red);font-size:1.1rem}.active{background:#198754;box-shadow:0 0 15px #31d17c80}
    .actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:12px}.touch{display:flex;justify-content:space-between;align-items:center;max-width:560px;margin:9px auto 0;touch-action:none;user-select:none}.dpad{display:grid;grid-template:repeat(3,48px)/repeat(3,48px);gap:3px}.touch button{width:48px;height:48px;padding:0;font-size:1.35rem;background:#343942}.touch .up{grid-column:2}.touch .left{grid-column:1;grid-row:2}.touch .down{grid-column:2;grid-row:2}.touch .right{grid-column:3;grid-row:2}.fire{width:82px!important;height:82px!important;border-radius:50%!important;background:var(--red)!important;font-size:1rem!important}
    footer{font-size:.75rem;color:#777;margin-top:10px}@media (min-width:800px) and (pointer:fine){.touch{opacity:.7}.touch button{width:42px;height:42px}.dpad{grid-template:repeat(3,42px)/repeat(3,42px)}}
  </style>
</head>
<body><main>
  <h1>RL BATTLE CITY</h1><p>รถถังผู้พิทักษ์ฐาน — เล่นเองหรือเปิด AI Autopilot</p>
  <section class="hud" aria-label="สถานะเกม"><div class="stat">คะแนน<b id="score">0</b></div><div class="stat">ชีวิต<b id="lives">3</b></div><div class="stat">ศัตรู<b id="enemies">0</b></div><div class="stat">โหมด<b id="mode">MANUAL</b></div></section>
  <div class="stage"><canvas id="gameCanvas" width="416" height="416" aria-label="สนาม Battle City"></canvas><div class="overlay" id="overlay"><h2 id="message">BATTLE CITY</h2><p id="submessage">ปุ่มลูกศร / WASD เพื่อเคลื่อนที่ • Space เพื่อยิง<br>ปกป้องฐานนกอินทรีด้านล่าง!</p><button class="primary" id="startButton">เริ่มเกม</button></div></div>
  <div class="actions"><button id="agentToggle" aria-pressed="false">🤖 เปิด AI Autopilot</button><button id="restartButton">↻ เริ่มใหม่</button><button id="soundToggle" aria-pressed="true">🔊 เสียง</button></div>
  <div class="touch" id="touchControls" aria-label="ปุ่มควบคุมแบบสัมผัส"><div class="dpad"><button class="up" data-key="ArrowUp" aria-label="ขึ้น">▲</button><button class="left" data-key="ArrowLeft" aria-label="ซ้าย">◀</button><button class="down" data-key="ArrowDown" aria-label="ลง">▼</button><button class="right" data-key="ArrowRight" aria-label="ขวา">▶</button></div><button class="fire" data-key="Space" aria-label="ยิง">FIRE</button></div>
  <footer>Battle City browser tribute • Level และเสียงทำงานแบบ local</footer>
  <script src="game.js"></script>
</main></body></html>
